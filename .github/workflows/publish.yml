name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (Core)
        run: dotnet test test/Fang.Notification.Core.Tests --no-build --configuration Release

      - name: Test (DingTalk)
        run: dotnet test test/Fang.Notification.DingTalk.Tests --no-build --configuration Release

      - name: Test (Feishu)
        run: dotnet test test/Fang.Notification.Feishu.Tests --no-build --configuration Release

      - name: Test (WeCom)
        run: dotnet test test/Fang.Notification.WeCom.Tests --no-build --configuration Release

      - name: Pack all required packages
        run: |
          dotnet pack src/Fang.Notification.Core/Fang.Notification.Core.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.Common/Fang.Notification.Common.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.DingTalk/Fang.Notification.DingTalk.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.Feishu/Fang.Notification.Feishu.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.WeCom/Fang.Notification.WeCom.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.Email/Fang.Notification.Email.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.Teams/Fang.Notification.Teams.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.Facade/Fang.Notification.Facade.csproj --no-build --configuration Release --output ./nupkgs
          dotnet pack src/Fang.Notification.All/Fang.Notification.All.csproj --no-build --configuration Release --output ./nupkgs

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate