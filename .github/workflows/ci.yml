name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (Core)
        run: dotnet test test/Fang.Notification.Core.Tests --no-build --configuration Release

      - name: Test (DingTalk)
        run: dotnet test test/Fang.Notification.DingTalk.Tests --no-build --configuration Release

      - name: Test (Feishu)
        run: dotnet test test/Fang.Notification.Feishu.Tests --no-build --configuration Release

      - name: Test (WeCom)
        run: dotnet test test/Fang.Notification.WeCom.Tests --no-build --configuration Release
